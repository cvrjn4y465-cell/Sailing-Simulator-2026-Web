<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#031824"><link rel="apple-touch-icon" href="index.apple-touch-icon.png"><title>Windward: Sail Simulator 2027 Remote</title><style>
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;touch-action:none}body{margin:0;min-height:100dvh;padding:calc(env(safe-area-inset-top) + 12px) 14px calc(env(safe-area-inset-bottom) + 12px);background:linear-gradient(#073452,#031824);color:#fff;font-family:system-ui,sans-serif}h1{font-size:21px;margin:0;text-align:center;color:#70e4f7}#pair{max-width:430px;margin:18vh auto 0;padding:22px;background:#061f2dcc;border:1px solid #3fd4eb;border-radius:18px;text-align:center}input{width:210px;font-size:30px;letter-spacing:8px;text-align:center;padding:10px;border-radius:11px;border:2px solid #58dcef;background:#fff;color:#08202c}button{border:0;color:white;background:#174c64;border-radius:14px;font-weight:700;font-size:17px;box-shadow:inset 0 0 0 1px #ffffff33,0 4px 10px #0005}button:active,.held{background:#f0bd26!important;color:#071720!important;transform:translateY(2px)}#connect{display:block;margin:14px auto 0;padding:13px 30px;background:#168a70}.error{color:#ff8f85;min-height:22px}.hidden{display:none!important}#controls{max-width:700px;margin:auto}.status{text-align:center;font-size:14px;color:#9ce5ef;margin:3px 0 10px}.helm{display:grid;grid-template-columns:1fr 1fr;gap:12px}.helm button{height:104px;font-size:24px;background:#176789}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:10px}.grid button{min-height:62px;padding:8px 4px}.main{background:#217c57!important}.ease{background:#9a4e35!important}.utility{background:#4c5664!important}.menu{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:10px}.menu button{height:48px}.hint{text-align:center;color:#9dc1cc;font-size:12px;margin:10px 0 0}@media(max-width:430px){.grid{grid-template-columns:repeat(3,1fr)}.helm button{height:92px}.grid button{font-size:15px}}
</style></head><body><section id="pair"><h1>WINDWARD SAIL REMOTE</h1><p>Enter the six-digit code shown on the TV.</p><input id="code" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="000000"><button id="connect">CONNECT</button><p id="error" class="error"></p></section><main id="controls" class="hidden"><h1>WINDWARD: SAIL SIMULATOR 2027</h1><div id="status" class="status">Connected to TV</div><div class="helm"><button data-hold="ArrowLeft">◀ PORT</button><button data-hold="ArrowRight">STARBOARD ▶</button></div><div class="grid"><button class="main" data-hold="KeyA">MAIN IN</button><button class="ease" data-hold="KeyZ">MAIN OUT</button><button class="main" data-hold="KeyD">JIB IN</button><button class="ease" data-hold="KeyC">JIB OUT</button><button data-hold="KeyS">TRAVELER IN</button><button data-hold="KeyX">TRAVELER OUT</button><button data-hold="KeyR">BOARD UP</button><button data-hold="KeyV">BOARD DOWN</button><button data-tap="KeyF">JIB FURL</button><button data-tap="Space">CAMERA</button><button class="utility" data-tap="Escape">PAUSE</button><button class="utility" data-tap="Enter">SELECT</button></div><div class="menu"><button data-tap="ArrowUp">▲ MENU</button><button data-tap="ArrowDown">▼ MENU</button><button data-tap="Tab">NEXT VIEW</button></div><p class="hint">Hold steering and sheet buttons for smooth control. Both devices need internet access.</p></main><script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script><script>
const km={ArrowLeft:["ArrowLeft","ArrowLeft"],ArrowRight:["ArrowRight","ArrowRight"],ArrowUp:["ArrowUp","ArrowUp"],ArrowDown:["ArrowDown","ArrowDown"],Space:[" ","Space"],Enter:["Enter","Enter"],Escape:["Escape","Escape"],Tab:["Tab","Tab"],KeyA:["a","KeyA"],KeyZ:["z","KeyZ"],KeyD:["d","KeyD"],KeyC:["c","KeyC"],KeyS:["s","KeyS"],KeyX:["x","KeyX"],KeyR:["r","KeyR"],KeyV:["v","KeyV"],KeyF:["f","KeyF"]};let conn=null;const send=(c,d)=>{if(!conn?.open)return;const p=km[c];conn.send({type:"key",key:p[0],code:p[1],down:d})};document.getElementById("connect").onclick=()=>{const c=document.getElementById("code").value.replace(/\D/g,"");const e=document.getElementById("error");if(c.length!==6){e.textContent="Enter all six numbers.";return}e.textContent="Connecting…";const peer=new Peer();peer.on("open",()=>{conn=peer.connect(`sailtv-${c}`,{reliable:true});conn.on("open",()=>{document.getElementById("pair").classList.add("hidden");document.getElementById("controls").classList.remove("hidden")});conn.on("close",()=>document.getElementById("status").textContent="Disconnected — reload to reconnect");conn.on("error",()=>e.textContent="Could not connect. Check the TV code.")});peer.on("error",()=>e.textContent="Could not connect. Check the code and internet.")};document.querySelectorAll("[data-hold]").forEach(b=>{const c=b.dataset.hold;const down=e=>{e.preventDefault();b.classList.add("held");send(c,true)};const up=e=>{e.preventDefault();b.classList.remove("held");send(c,false)};b.addEventListener("pointerdown",down);b.addEventListener("pointerup",up);b.addEventListener("pointercancel",up);b.addEventListener("pointerleave",e=>{if(e.buttons)up(e)})});document.querySelectorAll("[data-tap]").forEach(b=>b.addEventListener("click",e=>{e.preventDefault();const c=b.dataset.tap;send(c,true);setTimeout(()=>send(c,false),80)}));window.addEventListener("pagehide",()=>document.querySelectorAll("[data-hold]").forEach(b=>send(b.dataset.hold,false)));
</script></body></html>
